<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>ETF Portfolio Tracker</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4"></script>
<script src="https://cdn.jsdelivr.net/npm/chartjs-plugin-datalabels@2"></script>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#0f1117;--surface:#1a1d27;--surface2:#242833;--border:#2e3341;
  --ink:#e4e6ed;--muted:#8b8fa3;--accent:#6366f1;--accent2:#818cf8;
  --up:#22c55e;--down:#ef4444;--buy:#22c55e;--sell:#ef4444;
  --new:#a78bfa;--removed:#64748b;--price:#3b82f6;
  --font:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;
  --radius:10px;
}
html{font-family:var(--font);font-size:14px;background:var(--bg);color:var(--ink)}
body{min-height:100vh}
a{color:var(--accent2);text-decoration:none}

/* Header */
.header{padding:20px 24px 0;max-width:1200px;margin:0 auto}
.header h1{font-size:20px;font-weight:800;color:var(--ink)}
.header h1 span{color:var(--accent2);font-weight:400;font-size:14px;margin-left:8px}
.header-sub{font-size:12px;color:var(--muted);margin-top:4px}

/* Tabs */
.tabs{display:flex;gap:0;padding:0 24px;max-width:1200px;margin:16px auto 0;border-bottom:1px solid var(--border);overflow-x:auto;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{padding:10px 20px;border:none;background:none;color:var(--muted);font-family:var(--font);font-size:13px;font-weight:600;cursor:pointer;border-bottom:2px solid transparent;transition:all .15s;white-space:nowrap}
.tab:hover{color:var(--ink)}
.tab.active{color:var(--accent2);border-bottom-color:var(--accent2)}

/* Week selector */
.week-bar{display:flex;align-items:center;gap:12px;padding:12px 24px;max-width:1200px;margin:0 auto}
.week-bar label{font-size:12px;color:var(--muted);font-weight:600}
.week-bar select{background:var(--surface);color:var(--ink);border:1px solid var(--border);border-radius:6px;padding:6px 10px;font-size:12px;font-family:var(--font)}

/* Sub tabs */
.sub-tabs{display:flex;gap:6px;padding:0 24px;max-width:1200px;margin:8px auto;flex-wrap:wrap}
.sub-tab{padding:6px 14px;border-radius:20px;border:1px solid var(--border);background:var(--surface);color:var(--muted);font-size:11px;font-weight:600;cursor:pointer;transition:all .15s}
.sub-tab.active{background:var(--accent);color:#fff;border-color:var(--accent)}

/* Content */
.content{max-width:1200px;margin:0 auto;padding:16px 24px}

/* Table */
.tbl{width:100%;border-collapse:collapse;font-size:12px;table-layout:auto}
.tbl th{text-align:left;padding:8px 10px;color:var(--muted);font-weight:700;border-bottom:2px solid var(--border);font-size:11px;white-space:nowrap;background:var(--bg)}
.tbl td{padding:8px 10px;border-bottom:1px solid var(--border);vertical-align:middle;white-space:nowrap}
.tbl .name-cell{max-width:180px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tbl .sector-cell{max-width:90px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--muted)}
.tbl tbody tr:hover{background:var(--surface)}
.tbl .r{text-align:right}
.tbl .ticker{font-weight:700;color:var(--accent2)}

/* Signal badges */
.sig{display:inline-block;font-size:10px;font-weight:700;padding:2px 8px;border-radius:6px}
.sig-buy{background:rgba(34,197,94,0.15);color:var(--buy)}
.sig-sell{background:rgba(239,68,68,0.15);color:var(--sell)}
.sig-new{background:rgba(167,139,250,0.15);color:var(--new)}
.sig-removed{background:rgba(100,116,139,0.15);color:var(--removed)}
.sig-price_effect{background:rgba(59,130,246,0.12);color:var(--price)}
.sig-hold{background:rgba(139,143,163,0.1);color:var(--muted)}

/* Sector chart area */
.sector-grid{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.chart-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:16px}
.chart-card h3{font-size:13px;color:var(--muted);margin-bottom:12px;font-weight:600}

/* Compare bars */
.cmp-row{display:flex;align-items:center;gap:8px;margin-bottom:6px;font-size:12px}
.cmp-ticker{width:50px;font-weight:700;color:var(--accent2);text-align:right;flex-shrink:0}
.cmp-name{width:140px;color:var(--muted);font-size:11px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex-shrink:0}
.cmp-bars{flex:1;display:flex;gap:2px;align-items:center;height:20px}
.cmp-bar{height:100%;border-radius:3px;min-width:1px;transition:width .3s}
.cmp-bar.time{background:var(--accent)}
.cmp-bar.koact{background:var(--new)}
.cmp-bar.kosdaq{background:#14b8a6}
.cmp-val{font-size:10px;color:var(--muted);width:60px;text-align:right;flex-shrink:0}
.cmp-legend{display:flex;gap:16px;margin-bottom:12px;font-size:11px;color:var(--muted)}
.cmp-legend span::before{content:'';display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:4px;vertical-align:middle}
.cmp-legend .l-time::before{background:var(--accent)}
.cmp-legend .l-koact::before{background:var(--new)}
.cmp-legend .l-kosdaq::before{background:#14b8a6}

/* Overlap badge */
.overlap-badge{font-size:9px;padding:1px 6px;border-radius:4px;background:rgba(99,102,241,0.2);color:var(--accent2);margin-left:4px;font-weight:600}

/* History chart */
.history-wrap{margin-top:16px}
.history-select{background:var(--surface);color:var(--ink);border:1px solid var(--border);border-radius:6px;padding:6px 10px;font-size:12px;font-family:var(--font);min-width:200px}

/* Signals summary */
.sig-summary{display:flex;gap:12px;flex-wrap:wrap;margin-bottom:16px}
.sig-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:12px 16px;min-width:120px}
.sig-card .label{font-size:11px;color:var(--muted);margin-bottom:4px}
.sig-card .count{font-size:24px;font-weight:800}
.sig-card.buy .count{color:var(--buy)}
.sig-card.sell .count{color:var(--sell)}
.sig-card.new .count{color:var(--new)}
.sig-card.removed .count{color:var(--removed)}

/* Empty */
.empty{text-align:center;color:var(--muted);padding:40px;font-size:13px}

/* Signal highlight rows */
.tbl tbody tr.row-new{background:rgba(167,139,250,0.10)}
.tbl tbody tr.row-buy{background:rgba(34,197,94,0.07)}
.tbl tbody tr.row-sell{background:rgba(239,68,68,0.06)}

/* New entry spotlight cards */
.spotlight{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:20px}
.spotlight-card{background:rgba(167,139,250,0.12);border:1px solid rgba(167,139,250,0.35);border-radius:10px;padding:10px 14px;min-width:160px;flex:1 1 160px}
.spotlight-card .sp-etf{font-size:10px;color:var(--new);font-weight:700;margin-bottom:3px}
.spotlight-card .sp-ticker{font-size:15px;font-weight:800;color:var(--ink)}
.spotlight-card .sp-name{font-size:11px;color:var(--muted);margin-top:1px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.spotlight-card .sp-weight{font-size:12px;font-weight:700;color:var(--new);margin-top:4px}

/* Responsive */
@media(max-width:768px){
  .sector-grid{grid-template-columns:1fr}
  .cmp-name{width:80px}
  .header{padding:16px}
  .content{padding:12px 16px}
  .tabs{padding:0 16px}
}
</style>
</head>
<body>

<div class="header">
  <h1>ETF Portfolio Tracker<span>Active ETF Daily Monitor</span></h1>
  <div class="header-sub">TIME 미국나스닥100액티브 &middot; KoAct 미국나스닥성장기업액티브 &middot; KoAct 코스닥액티브 &middot; TIME 코스닥액티브</div>
</div>

<nav class="tabs" id="tabs">
  <button class="tab active" data-tab="nasdaq">나스닥</button>
  <button class="tab" data-tab="kosdaq_market">코스닥</button>
  <button class="tab" data-tab="ark_market">ARK</button>
  <button class="tab" data-tab="investors">거장</button>
  <button class="tab" data-tab="compare">비교</button>
  <button class="tab" data-tab="signals">시그널</button>
  <button class="tab" data-tab="history">히스토리</button>
</nav>

<div class="sub-tabs" id="etf-selector">
  <button class="sub-tab active" data-etf="time">TIME</button>
  <button class="sub-tab" data-etf="koact">KoAct</button>
</div>

<div class="week-bar" id="week-bar">
  <label>주차</label>
  <select id="week-select"></select>
</div>

<div class="sub-tabs" id="sub-tabs">
  <button class="sub-tab active" data-view="all">전체 종목</button>
  <button class="sub-tab" data-view="common">공통</button>
  <button class="sub-tab" data-view="sector">섹터 분석</button>
</div>

<div class="content" id="content"></div>

<script>
/* ── Data & State ── */
var DATA = null;
var activeTab = "nasdaq";      // nasdaq | kosdaq_market | ark_market | investors | compare | signals | history
var activeInvestor = "berkshire"; // berkshire | pershing | scion | duquesne
var activeEtf = "time";        // time|koact / time_kosdaq|koact / arkk|arkq|arkw|arkg
var ETF_TABS = ["nasdaq", "kosdaq_market", "ark_market"];

// 현재 실제 ETF 데이터 키 반환
function activeEtfKey(){
  if (activeTab === "nasdaq") return activeEtf === "koact" ? "koact" : "time";
  if (activeTab === "kosdaq_market") return activeEtf === "koact" ? "kosdaq" : "time_kosdaq";
  if (activeTab === "ark_market") return activeEtf; // arkk|arkq|arkw|arkg 그대로
  return "time";
}
var activeView = "all";
var activeWeekIdx = -1; // -1 = latest

var SIGNAL_LABELS = {
  buy: {emoji: "\uD83D\uDFE2", label: "매수", cls: "sig-buy"},
  sell: {emoji: "\uD83D\uDD34", label: "매도", cls: "sig-sell"},
  new: {emoji: "\uD83D\uDFE3", label: "신규편입", cls: "sig-new"},
  removed: {emoji: "\u26AB", label: "제외", cls: "sig-removed"},
  price_effect: {emoji: "\uD83D\uDCCA", label: "주가효과", cls: "sig-price_effect"},
  hold: {emoji: "", label: "보유", cls: "sig-hold"},
};

/* ── Init ── */
fetch("data/combined.json?t=" + Date.now())
  .then(function(r){ return r.json(); })
  .then(function(d){
    DATA = d;
    initWeekSelect();
    render();
  })
  .catch(function(e){
    document.getElementById("content").innerHTML = '<div class="empty">데이터를 불러오지 못했습니다.</div>';
  });

/* ── Tab events ── */
document.getElementById("tabs").addEventListener("click", function(e){
  var btn = e.target.closest(".tab");
  if (!btn) return;
  activeTab = btn.dataset.tab;
  // 탭 전환 시 ETF 선택 초기화
  if (activeTab === "nasdaq")        activeEtf = "time";
  if (activeTab === "kosdaq_market") activeEtf = "time_kosdaq";
  if (activeTab === "ark_market")    activeEtf = "arkk";
  document.querySelectorAll(".tab").forEach(function(b){ b.classList.toggle("active", b.dataset.tab === activeTab); });
  updateUIVisibility();
  render();
});

document.getElementById("etf-selector").addEventListener("click", function(e){
  var btn = e.target.closest(".sub-tab");
  if (!btn) return;
  activeEtf = btn.dataset.etf;
  document.querySelectorAll("#etf-selector .sub-tab").forEach(function(b){ b.classList.toggle("active", b.dataset.etf === activeEtf); });
  render();
});

document.getElementById("sub-tabs").addEventListener("click", function(e){
  var btn = e.target.closest(".sub-tab");
  if (!btn) return;
  activeView = btn.dataset.view;
  document.querySelectorAll("#sub-tabs .sub-tab").forEach(function(b){ b.classList.toggle("active", b.dataset.view === activeView); });
  render();
});

document.getElementById("week-select").addEventListener("change", function(){
  activeWeekIdx = parseInt(this.value);
  render();
});

function updateUIVisibility(){
  var wb  = document.getElementById("week-bar");
  var st  = document.getElementById("sub-tabs");
  var es  = document.getElementById("etf-selector");
  var isETF = ETF_TABS.indexOf(activeTab) !== -1;

  // ── 서브탭 버튼을 탭 컨텍스트에 맞게 교체 ──
  var subBtns = st.querySelectorAll(".sub-tab");
  if (isETF) {
    // ETF 탭: 전체 종목 | TOP 10 | 섹터 분석
    if (subBtns[1].dataset.view !== "top10") {
      subBtns[1].textContent = "TOP 10";
      subBtns[1].dataset.view = "top10";
      // 비교탭에서 넘어올 때 공통·섹터 선택 상태 리셋
      if (activeView === "common") activeView = "all";
      subBtns.forEach(function(b){ b.classList.toggle("active", b.dataset.view === activeView); });
    }
  } else if (activeTab === "compare") {
    // 비교 탭: 전체 종목 | 공통 | 섹터 분석
    if (subBtns[1].dataset.view !== "common") {
      subBtns[1].textContent = "공통";
      subBtns[1].dataset.view = "common";
      // ETF 탭에서 넘어올 때 top10 선택 상태 리셋
      if (activeView === "top10") activeView = "all";
      subBtns.forEach(function(b){ b.classList.toggle("active", b.dataset.view === activeView); });
    }
  }

  // ETF 셀렉터 버튼 텍스트를 시장에 맞게 업데이트
  if (activeTab === "kosdaq_market") {
    es.innerHTML =
      '<button class="sub-tab" data-etf="time_kosdaq">TIME</button>' +
      '<button class="sub-tab" data-etf="koact">KoAct</button>';
  } else if (activeTab === "nasdaq") {
    es.innerHTML =
      '<button class="sub-tab" data-etf="time">TIME</button>' +
      '<button class="sub-tab" data-etf="koact">KoAct</button>';
  } else if (activeTab === "ark_market") {
    es.innerHTML =
      '<button class="sub-tab" data-etf="arkk">ARKK<span style="font-size:9px;display:block;color:var(--muted);font-weight:400">혁신</span></button>' +
      '<button class="sub-tab" data-etf="arkq">ARKQ<span style="font-size:9px;display:block;color:var(--muted);font-weight:400">로봇/자율</span></button>' +
      '<button class="sub-tab" data-etf="arkw">ARKW<span style="font-size:9px;display:block;color:var(--muted);font-weight:400">인터넷/AI</span></button>' +
      '<button class="sub-tab" data-etf="arkg">ARKG<span style="font-size:9px;display:block;color:var(--muted);font-weight:400">바이오</span></button>';
  }
  if (ETF_TABS.indexOf(activeTab) !== -1) {
    es.querySelectorAll(".sub-tab").forEach(function(b){
      b.classList.toggle("active", b.dataset.etf === activeEtf);
    });
  }

  if (activeTab === "compare" || activeTab === "history") {
    wb.style.display = "none";
    es.style.display = "none";
    st.style.display = activeTab === "compare" ? "flex" : "none";
  } else if (activeTab === "signals") {
    wb.style.display = "flex";
    es.style.display = "none";
    st.style.display = "none";
  } else if (activeTab === "investors") {
    wb.style.display = "none";
    es.style.display = "none";
    st.style.display = "none";
  } else if (isETF) {
    wb.style.display = "flex";
    es.style.display = "flex";
    st.style.display = "flex";
  }
}

function initWeekSelect(){
  var sel = document.getElementById("week-select");
  // 현재 선택된 ETF 기준 weeks 사용
  var key = activeEtfKey();
  var weeks = (DATA[key] && DATA[key].weeks.length) ? DATA[key].weeks : DATA.time.weeks;
  ["time","koact","kosdaq","time_kosdaq"].forEach(function(k){
    if (DATA[k] && DATA[k].weeks.length > weeks.length) weeks = DATA[k].weeks;
  });
  sel.innerHTML = "";
  weeks.forEach(function(w, i){
    var opt = document.createElement("option");
    opt.value = i;
    opt.textContent = w.date;
    if (i === weeks.length - 1) opt.selected = true;
    sel.appendChild(opt);
  });
  activeWeekIdx = weeks.length - 1;
}

/* ── Render dispatcher ── */
function render(){
  var el = document.getElementById("content");
  if (!DATA) return;
  if (ETF_TABS.indexOf(activeTab) !== -1) renderETF(el, activeEtfKey());
  else if (activeTab === "investors") renderInvestors(el);
  else if (activeTab === "compare") renderCompare(el);
  else if (activeTab === "signals") renderSignals(el);
  else if (activeTab === "history") renderHistory(el);
}

/* ── ETF Tab ── */
function renderETF(el, key){
  var weeks = DATA[key].weeks;
  if (!weeks.length){ el.innerHTML = '<div class="empty">데이터 없음</div>'; return; }
  var idx = Math.min(activeWeekIdx, weeks.length - 1);
  var week = weeks[idx];

  if (activeView === "sector"){
    renderSectorView(el, week, key);
    return;
  }

  var holdings = week.holdings.filter(function(h){ return h.signal !== "removed"; });
  if (activeView === "top10") holdings = holdings.slice(0, 10);

  var html = '<div style="overflow-x:auto;-webkit-overflow-scrolling:touch"><table class="tbl" style="min-width:620px"><thead><tr>'
    + '<th>#</th><th>티커</th><th>종목명</th><th>섹터</th>'
    + '<th class="r">비중%</th><th class="r">수량</th>'
    + '<th class="r">수량변화</th><th class="r">비중변화</th><th>매매구분</th>'
    + '</tr></thead><tbody>';

  holdings.forEach(function(h, i){
    var sig = SIGNAL_LABELS[h.signal] || SIGNAL_LABELS.hold;
    var wchg = h.weight_chg != null ? (h.weight_chg > 0 ? "+" : "") + h.weight_chg.toFixed(2) : "-";
    var wchgColor = h.weight_chg > 0 ? "var(--up)" : h.weight_chg < 0 ? "var(--down)" : "var(--muted)";
    var schg = h.shares_chg_pct != null ? (h.shares_chg_pct > 0 ? "+" : "") + h.shares_chg_pct.toFixed(1) + "%" : "-";
    var schgColor = h.shares_chg_pct > 0 ? "var(--up)" : h.shares_chg_pct < 0 ? "var(--down)" : "var(--muted)";
    html += '<tr>'
      + '<td style="color:var(--muted);width:28px">' + (i+1) + '</td>'
      + '<td class="ticker" style="width:62px">' + h.ticker + '</td>'
      + '<td class="name-cell" title="' + h.name + '">' + h.name + '</td>'
      + '<td class="sector-cell" title="' + (h.sector||"") + '">' + (h.sector || "") + '</td>'
      + '<td class="r" style="font-weight:700;width:54px">' + (h.weight != null ? h.weight.toFixed(2) : "-") + '</td>'
      + '<td class="r" style="width:80px">' + (h.shares != null ? h.shares.toLocaleString() : "-") + '</td>'
      + '<td class="r" style="color:' + schgColor + ';width:64px">' + schg + '</td>'
      + '<td class="r" style="color:' + wchgColor + ';width:60px">' + wchg + '</td>'
      + '<td style="width:76px"><span class="sig ' + sig.cls + '">' + sig.emoji + ' ' + sig.label + '</span></td>'
      + '</tr>';
  });

  html += '</tbody></table></div>';
  el.innerHTML = html;
}

/* ── Sector View ── */
function renderSectorView(el, week, key){
  var sectors = week.sectors || [];
  var maxW = sectors.length ? sectors[0].weight : 1;

  var html = '<div class="sector-grid"><div class="chart-card"><h3>섹터별 비중</h3>';
  html += '<canvas id="sector-chart" height="300"></canvas></div>';
  html += '<div class="chart-card"><h3>섹터 상세</h3>';
  html += '<table class="tbl"><thead><tr><th>섹터</th><th class="r">비중%</th><th class="r">종목수</th></tr></thead><tbody>';

  // 종목수 계산
  var sectorCounts = {};
  week.holdings.forEach(function(h){
    if (h.signal === "removed") return;
    var s = h.sector || "미분류";
    sectorCounts[s] = (sectorCounts[s] || 0) + 1;
  });

  sectors.forEach(function(s){
    html += '<tr><td style="font-weight:600">' + s.sector + '</td>'
      + '<td class="r" style="font-weight:700">' + s.weight.toFixed(2) + '</td>'
      + '<td class="r">' + (sectorCounts[s.sector] || 0) + '</td></tr>';
  });
  html += '</tbody></table></div></div>';
  el.innerHTML = html;

  // Draw chart
  var ctx = document.getElementById("sector-chart");
  if (ctx) {
    var colors = ["#6366f1","#a78bfa","#22c55e","#3b82f6","#f59e0b","#ef4444","#ec4899","#14b8a6","#8b5cf6","#64748b","#f97316","#06b6d4"];
    new Chart(ctx, {
      type: "doughnut",
      data: {
        labels: sectors.map(function(s){ return s.sector; }),
        datasets: [{
          data: sectors.map(function(s){ return s.weight; }),
          backgroundColor: colors.slice(0, sectors.length),
          borderWidth: 0,
        }]
      },
      plugins: [ChartDataLabels],
      options: {
        responsive: true,
        plugins: {
          legend: { position: "bottom", labels: { color: "#8b8fa3", font: {size: 11}, padding: 12 } },
          datalabels: {
            color: "#fff",
            font: { size: 11, weight: "bold" },
            formatter: function(value, ctx) {
              var label = ctx.chart.data.labels[ctx.dataIndex];
              if (value < 2) return "";

/* ── Compare Tab ── */
function renderCompare(el){
  if (activeView === "sector") { renderCompareSectors(el); return; }
  if (activeView === "common") { renderCompareCommon(el); return; }

  // "all" view: show top 10 by default, expand to all on click
  var limit = 10;
  var html = "";
  html += buildPairSection("time", "koact", "TIME", "KoAct", "var(--accent)", "var(--new)", "나스닥", "nasdaq", limit);
  html += '<div style="height:24px"></div>';
  html += buildPairSection("time_kosdaq", "kosdaq", "TIME", "KoAct", "#f59e0b", "#14b8a6", "코스닥", "kosdaq", limit);

  el.innerHTML = html;

  // Expand button listeners
  el.querySelectorAll(".expand-btn").forEach(function(btn){
    btn.addEventListener("click", function(){
      var market = btn.dataset.market;
      var section = el.querySelector('[data-market-section="' + market + '"]');
      if (!section) return;
      var newHtml;
      if (market === "nasdaq")
        newHtml = buildPairSection("time", "koact", "TIME", "KoAct", "var(--accent)", "var(--new)", "나스닥", "nasdaq", null);
      else
        newHtml = buildPairSection("time_kosdaq", "kosdaq", "TIME", "KoAct", "#f59e0b", "#14b8a6", "코스닥", "kosdaq", null);
      var tmp = document.createElement("div");
      tmp.innerHTML = newHtml;
      section.replaceWith(tmp.firstElementChild);
    });
  });
}

function buildPairSection(keyA, keyB, labelA, labelB, colorA, colorB, marketLabel, marketKey, limit){
  var allMap = {};
  [[keyA, "a"],[keyB, "b"]].forEach(function(pair){
    var key = pair[0], side = pair[1];
    if (!DATA[key]) return;
    var weeks = DATA[key].weeks;
    if (!weeks.length) return;
    weeks[weeks.length-1].holdings.forEach(function(h){
      if (h.signal === "removed") return;
      if (!allMap[h.ticker]) allMap[h.ticker] = {ticker:h.ticker, name:h.name, a:0, b:0};
      allMap[h.ticker][side] = h.weight || 0;
    });
  });

  var allItems = Object.values(allMap);
  allItems.sort(function(x,y){ return (y.a+y.b)-(x.a+x.b); });
  var totalCount = allItems.length;
  var items = (limit != null) ? allItems.slice(0, limit) : allItems;

  if (!items.length) return "";

  var maxW = 0;
  allItems.forEach(function(o){ maxW = Math.max(maxW, o.a, o.b); });
  if (maxW === 0) maxW = 1;

  var commonCount = allItems.filter(function(o){ return o.a > 0 && o.b > 0; }).length;

  var html = '<div data-market-section="' + marketKey + '">';
  html += '<div style="margin-bottom:6px;display:flex;align-items:center;gap:10px">'
    + '<span style="font-size:13px;font-weight:800;color:var(--ink)">' + marketLabel + '</span>'
    + '<span style="font-size:11px;color:var(--muted)">공통 ' + commonCount + '종목</span>'
    + '<span style="font-size:11px;color:var(--muted);margin-left:auto">'
    + '<span style="display:inline-block;width:8px;height:8px;border-radius:2px;background:' + colorA + ';margin-right:3px;vertical-align:middle"></span>' + labelA
    + '&nbsp;&nbsp;<span style="display:inline-block;width:8px;height:8px;border-radius:2px;background:' + colorB + ';margin-right:3px;vertical-align:middle"></span>' + labelB
    + '</span></div>';

  items.forEach(function(o){
    var badge = (o.a>0&&o.b>0) ? '<span class="overlap-badge">공통</span>' : '';
    html += '<div class="cmp-row">'
      + '<div class="cmp-ticker">' + o.ticker + '</div>'
      + '<div class="cmp-name">' + o.name + badge + '</div>'
      + '<div class="cmp-bars">'
      + '<div class="cmp-bar" style="background:' + colorA + ';width:' + (o.a/maxW*100) + '%;height:100%;border-radius:3px;min-width:' + (o.a>0?'1px':'0') + '"></div>'
      + '<div class="cmp-bar" style="background:' + colorB + ';width:' + (o.b/maxW*100) + '%;height:100%;border-radius:3px;min-width:' + (o.b>0?'1px':'0') + '"></div>'
      + '</div>'
      + '<div class="cmp-val">' + o.a.toFixed(1) + '/' + o.b.toFixed(1) + '</div>'
      + '</div>';
  });

  if (limit != null && totalCount > limit) {
    html += '<div style="text-align:center;margin-top:8px">'
      + '<button class="expand-btn" data-market="' + marketKey + '" style="background:var(--surface);border:1px solid var(--border);color:var(--muted);font-size:12px;padding:6px 20px;border-radius:20px;cursor:pointer">'
      + '▼ 전체보기 (' + totalCount + '개)</button></div>';
  }
  html += '</div>';
  return html;
}

    var onlyA = o.a > 0 && o.b === 0 ? '<span style="font-size:9px;padding:1px 5px;border-radius:4px;background:rgba(99,102,241,0.15);color:' + colorA + ';margin-left:4px;font-weight:600">' + labelA + '만</span>' : '';
    var onlyB = o.b > 0 && o.a === 0 ? '<span style="font-size:9px;padding:1px 5px;border-radius:4px;background:rgba(99,102,241,0.1);color:' + colorB + ';margin-left:4px;font-weight:600">' + labelB + '만</span>' : '';
    html += '<div class="cmp-row">'

      + '<div class="cmp-bars">'
      + '<div class="cmp-bar" style="background:' + colorA + ';width:' + (o.a/maxW*100) + '%;height:100%;border-radius:3px;min-width:' + (o.a>0?'1px':'0') + '"></div>'
      + '<div class="cmp-bar" style="background:' + colorB + ';width:' + (o.b/maxW*100) + '%;height:100%;border-radius:3px;min-width:' + (o.b>0?'1px':'0') + '"></div>'
      + '</div>'
      + '<div class="cmp-val">' + o.a.toFixed(1) + '/' + o.b.toFixed(1) + '</div>'
      + '</div>';

function renderCompareSectors(el){
  var groups = [
    {
      label: "나스닥",
      etfs: [
        {key:"time",  label:"TIME",  color:"#6366f1"},
        {key:"koact", label:"KoAct", color:"#a78bfa"},
      ]
    },
    {
      label: "코스닥",
      etfs: [
        {key:"time_kosdaq", label:"TIME",  color:"#f59e0b"},
        {key:"kosdaq",      label:"KoAct", color:"#14b8a6"},
      ]
    }
  ];

  var html = '<div style="display:flex;flex-direction:column;gap:20px">';

  groups.forEach(function(group, gi){
    var sectorMap = {};
    group.etfs.forEach(function(m){
      if (!DATA[m.key]) return;
      var weeks = DATA[m.key].weeks;
      if (!weeks.length) return;
      var sectors = weeks[weeks.length-1].sectors || [];
      sectors.forEach(function(s){
        if (!sectorMap[s.sector]) sectorMap[s.sector] = {};
        sectorMap[s.sector][m.key] = s.weight;
      });
    });
    if (!Object.keys(sectorMap).length) return;

    var labels = Object.keys(sectorMap).sort(function(a,b){
      var sa = group.etfs.reduce(function(s,m){ return s+(sectorMap[a][m.key]||0); },0);
      var sb = group.etfs.reduce(function(s,m){ return s+(sectorMap[b][m.key]||0); },0);
      return sb - sa;
    });

    html += '<div class="chart-card"><h3>' + group.label + ' — 섹터 비중</h3>'
      + '<canvas id="sector-compare-chart-' + gi + '" height="300"></canvas></div>';
  });

  html += '</div>';
  el.innerHTML = html;

  groups.forEach(function(group, gi){
    var sectorMap = {};
    group.etfs.forEach(function(m){
      if (!DATA[m.key]) return;
      var weeks = DATA[m.key].weeks;
      if (!weeks.length) return;
      (weeks[weeks.length-1].sectors || []).forEach(function(s){
        if (!sectorMap[s.sector]) sectorMap[s.sector] = {};
        sectorMap[s.sector][m.key] = s.weight;
      });
    });
    if (!Object.keys(sectorMap).length) return;

    var labels = Object.keys(sectorMap).sort(function(a,b){
      var sa = group.etfs.reduce(function(s,m){ return s+(sectorMap[a][m.key]||0); },0);
      var sb = group.etfs.reduce(function(s,m){ return s+(sectorMap[b][m.key]||0); },0);
      return sb - sa;
    });

    var ctx = document.getElementById("sector-compare-chart-" + gi);
    if (!ctx) return;
    new Chart(ctx, {
      type: "bar",
      data: {
        labels: labels,
        datasets: group.etfs.map(function(m){
          return {
            label: m.label,
            data: labels.map(function(l){ return sectorMap[l][m.key] || 0; }),
            backgroundColor: m.color
          };
        })
      },
      options: {
        responsive: true,
        indexAxis: "y",
        scales: {
          x: {grid:{color:"#2e3341"}, ticks:{color:"#8b8fa3"}},
          y: {grid:{display:false}, ticks:{color:"#e4e6ed", font:{size:11}}}
        },
        plugins: {legend:{labels:{color:"#8b8fa3"}}}
      }
    });
  });
}

/* ── Signals Tab ── */
function renderSignals(el){
  var idx = activeWeekIdx;

  var ETF_META = {
    time:        {label:"TIME 나스닥",  color:"#6366f1"},
    koact:       {label:"KoAct 나스닥", color:"#a78bfa"},
    kosdaq:      {label:"KoAct 코스닥", color:"#14b8a6"},
    time_kosdaq: {label:"TIME 코스닥",  color:"#f59e0b"},
    arkk:        {label:"ARKK 혁신",      color:"#ef4444"},
    arkq:        {label:"ARKQ 로봇/자율", color:"#f97316"},
    arkw:        {label:"ARKW 인터넷/AI", color:"#8b5cf6"},
    arkg:        {label:"ARKG 바이오",    color:"#10b981"},
  };

  // 각 ETF에서 선택된 날짜의 시그널 수집
  var etfSignals = {};   // etf key → sigs
  var etfLabels  = {};   // etf key → display label
  var selectedDate = "";

  ["time","koact","kosdaq","time_kosdaq","arkk","arkq","arkw","arkg"].forEach(function(key){
    if (!DATA[key]) return;
    var weeks = DATA[key].weeks;
    if (!weeks.length) return;
    var wi = Math.min(idx, weeks.length - 1);
    var week = weeks[wi];
    if (!selectedDate) selectedDate = week.date;
    var sigs = [];
    week.holdings.forEach(function(h){
      if (h.signal && h.signal !== "hold" && h.signal !== "price_effect"){
        sigs.push(Object.assign({}, h, {_etfKey: key}));
      }
    });
    etfSignals[key] = sigs;
    etfLabels[key]  = ETF_META[key] ? ETF_META[key].label : key;
  });

  // 전체 카운트
  var counts = {buy:0, sell:0, new:0, removed:0};
  Object.keys(etfSignals).forEach(function(key){
    etfSignals[key].forEach(function(s){ if (counts[s.signal] !== undefined) counts[s.signal]++; });
  });

  var html = '<div style="font-size:13px;color:var(--muted);margin-bottom:12px;font-weight:600">'
    + selectedDate + ' 일간 매매 시그널</div>';

  // Summary cards
  html += '<div class="sig-summary">';
  [{k:"new",l:"신규편입",e:"\uD83D\uDFE3"},{k:"buy",l:"매수",e:"\uD83D\uDFE2"},{k:"sell",l:"매도",e:"\uD83D\uDD34"},{k:"removed",l:"제외",e:"\u26AB"}].forEach(function(item){
    html += '<div class="sig-card ' + item.k + '"><div class="label">' + item.e + ' ' + item.l + '</div><div class="count">' + counts[item.k] + '</div></div>';
  });
  html += '</div>';

  var totalSignals = counts.buy + counts.sell + counts.new + counts.removed;
  if (totalSignals === 0){
    html += '<div class="empty">매매 시그널이 없습니다. (수량 변화 3% 이내)</div>';
    el.innerHTML = html;
    return;
  }

  // ── 신규편입 스포트라이트 ──
  var allNew = [];
  Object.keys(etfSignals).forEach(function(key){
    etfSignals[key].forEach(function(h){
      if (h.signal === "new") allNew.push(h);
    });
  });
  allNew.sort(function(a,b){ return (b.weight||0)-(a.weight||0); });

  if (allNew.length) {
    html += '<div style="font-size:12px;font-weight:700;color:var(--new);margin-bottom:8px">\uD83D\uDD14 신규편입 ' + allNew.length + '종목</div>';
    html += '<div class="spotlight">';
    allNew.forEach(function(h){
      var meta = ETF_META[h._etfKey] || {};
      html += '<div class="spotlight-card">'
        + '<div class="sp-etf" style="color:' + (meta.color||"var(--new)") + '">' + (meta.label||h._etfKey) + '</div>'
        + '<div class="sp-ticker">' + h.ticker + '</div>'
        + '<div class="sp-name" title="' + h.name + '">' + h.name + '</div>'
        + '<div class="sp-weight">' + (h.weight != null ? h.weight.toFixed(2) + '%' : '-') + '</div>'
        + '</div>';
    });
    html += '</div>';
  }

  // ── ETF별 시그널 테이블 ──
  var order = {new:0, buy:1, sell:2, removed:3};
  ["time","koact","kosdaq","time_kosdaq","arkk","arkq","arkw","arkg"].forEach(function(key){
    var sigs = etfSignals[key];
    if (!sigs || !sigs.length) return;
    sigs.sort(function(a,b){ return (order[a.signal]||9)-(order[b.signal]||9) || (b.weight||0)-(a.weight||0); });

    var meta = ETF_META[key] || {};
    html += '<h3 style="font-size:13px;font-weight:700;margin:20px 0 8px;color:var(--ink)">'
      + '<span style="display:inline-block;width:8px;height:8px;border-radius:2px;background:' + (meta.color||"var(--muted)") + ';margin-right:6px;vertical-align:middle"></span>'
      + (meta.label||key) + '</h3>';
    html += '<div style="overflow-x:auto;-webkit-overflow-scrolling:touch"><table class="tbl" style="min-width:520px"><thead><tr>'
      + '<th>구분</th><th>티커</th><th>종목명</th><th>섹터</th>'
      + '<th class="r">비중%</th><th class="r">수량변화</th><th class="r">비중변화</th>'
      + '</tr></thead><tbody>';

    sigs.forEach(function(h){
      var sig = SIGNAL_LABELS[h.signal] || SIGNAL_LABELS.hold;
      var wchg = h.weight_chg != null ? (h.weight_chg > 0 ? "+" : "") + h.weight_chg.toFixed(2) : "-";
      var wchgColor = h.weight_chg > 0 ? "var(--up)" : h.weight_chg < 0 ? "var(--down)" : "var(--muted)";
      var schg = h.shares_chg_pct != null ? (h.shares_chg_pct > 0 ? "+" : "") + h.shares_chg_pct.toFixed(1) + "%" : "-";
      var schgColor = h.shares_chg_pct > 0 ? "var(--up)" : h.shares_chg_pct < 0 ? "var(--down)" : "var(--muted)";
      var rowCls = h.signal === "new" ? "row-new" : h.signal === "buy" ? "row-buy" : h.signal === "sell" ? "row-sell" : "";
      html += '<tr class="' + rowCls + '">'
        + '<td style="width:76px"><span class="sig ' + sig.cls + '">' + sig.emoji + ' ' + sig.label + '</span></td>'
        + '<td class="ticker" style="width:62px">' + h.ticker + '</td>'
        + '<td class="name-cell" title="' + h.name + '">' + h.name + '</td>'
        + '<td class="sector-cell" title="' + (h.sector||"") + '">' + (h.sector || "") + '</td>'
        + '<td class="r" style="font-weight:700;width:54px">' + (h.weight != null ? h.weight.toFixed(2) : "-") + '</td>'
        + '<td class="r" style="color:' + schgColor + ';width:68px">' + schg + '</td>'
        + '<td class="r" style="color:' + wchgColor + ';width:60px">' + wchg + '</td>'
        + '</tr>';
    });
    html += '</tbody></table></div>';
  });

  el.innerHTML = html;
}

  scion:     {label:"Scion (버리)",           color:"#ef4444", flag:"🇺🇸"},
  duquesne:  {label:"Duquesne (드러켄밀러)", color:"#10b981", flag:"🇺🇸"},
};

function renderInvestors(el){
  var inv13f = DATA.investors_13f || {};
  var keys = ["berkshire","pershing","scion","duquesne"];

  // 서브탭 헤더 렌더
  var html = '<div class="sub-tabs" style="margin-bottom:20px;flex-wrap:wrap;gap:6px;display:flex">';
  keys.forEach(function(k){
    var m = INVESTOR_META[k];
    var active = k === activeInvestor ? "active" : "";
    html += '<button class="sub-tab ' + active + '" data-inv="' + k + '" style="font-size:12px">'
      + m.flag + ' ' + m.label + '</button>';
  });
  html += '</div><div id="inv-content"></div>';
  el.innerHTML = html;

  el.querySelectorAll("[data-inv]").forEach(function(btn){
    btn.addEventListener("click", function(){
      activeInvestor = this.dataset.inv;
      el.querySelectorAll("[data-inv]").forEach(function(b){ b.classList.remove("active"); });
      this.classList.add("active");
      renderInvestorPortfolio(document.getElementById("inv-content"), activeInvestor);
    });
  });

  renderInvestorPortfolio(document.getElementById("inv-content"), activeInvestor);
}

function renderInvestorPortfolio(el, key){
  var inv13f = DATA.investors_13f || {};
  var inv = inv13f[key];
  var meta = INVESTOR_META[key] || {label:key, color:"#8b8fa3"};

  if (!inv || !inv.quarters || !inv.quarters.length){
    el.innerHTML = '<div class="empty" style="margin-top:32px">📭 아직 데이터 없음<br>'
      + '<span style="font-size:12px;color:var(--muted)">맥에서 python scripts/crawl.py $(date +%F) ' + key + ' 실행</span></div>';
    return;
  }

  var q = inv.quarters[inv.quarters.length - 1];  // 최신 분기
  var holdings = q.holdings || [];
  var sigCounts = {new:0, buy:0, sell:0, removed:0, hold:0};
  holdings.forEach(function(h){ if(sigCounts[h.signal]!==undefined) sigCounts[h.signal]++; });

  var sigLabels = {new:"🟣 신규", buy:"🟢 추가매수", sell:"🔴 매도감소", removed:"⚫ 청산", hold:""};
  var sigColors = {new:"var(--new)", buy:"var(--up)", sell:"var(--down)", removed:"var(--muted)"};

  // 요약 카드
  var html = '<div style="font-size:12px;color:var(--muted);margin-bottom:12px;font-weight:600">'
    + meta.flag + ' ' + meta.label
    + '  <span style="font-weight:400">' + q.filing_date + ' 기준</span></div>';

  html += '<div class="sig-summary" style="margin-bottom:16px">';
  [{k:"new",l:"신규편입"},{k:"buy",l:"추가매수"},{k:"sell",l:"매도감소"},{k:"removed",l:"청산"}].forEach(function(item){
    if (!sigCounts[item.k]) return;
    html += '<div class="sig-card ' + item.k + '"><div class="label">' + item.l + '</div>'
      + '<div class="count">' + sigCounts[item.k] + '</div></div>';
  });
  html += '</div>';

  // 신규편입 스포트라이트
  var newItems = holdings.filter(function(h){ return h.signal === "new"; });
  if (newItems.length){
    html += '<div style="font-size:12px;font-weight:700;color:var(--new);margin-bottom:8px">🔔 신규편입 ' + newItems.length + '종목</div>';
    html += '<div class="spotlight" style="margin-bottom:20px">';
    newItems.forEach(function(h){
      html += '<div class="spotlight-card">'
        + '<div class="sp-etf" style="color:' + meta.color + '">' + meta.label + '</div>'
        + '<div class="sp-ticker">' + (h.ticker||"?") + '</div>'
        + '<div class="sp-name" title="' + h.name + '">' + h.name + '</div>'
        + '<div class="sp-weight">' + h.weight.toFixed(2) + '%</div>'
        + '</div>';
    });
    html += '</div>';
  }

  // 전체 포트폴리오 테이블
  var order = {new:0,buy:1,sell:2,hold:3,removed:4};
  var sorted = holdings.slice().sort(function(a,b){
    return (order[a.signal]||3)-(order[b.signal]||3) || (b.weight||0)-(a.weight||0);
  });
  var SIG = {new:{cls:"new",emoji:"🟣",label:"신규"}, buy:{cls:"buy",emoji:"🟢",label:"추가"},
             sell:{cls:"sell",emoji:"🔴",label:"감소"}, removed:{cls:"sell",emoji:"⚫",label:"청산"},
             hold:{cls:"hold",emoji:"",label:""}};

  html += '<div style="overflow-x:auto;-webkit-overflow-scrolling:touch">'
    + '<table class="tbl" style="min-width:480px"><thead><tr>'
    + '<th>구분</th><th>티커</th><th class="name-cell">종목명</th><th class="sector-cell">섹터</th>'
    + '<th class="r">비중%</th><th class="r">비중변화</th><th class="r">주식수</th>'
    + '</tr></thead><tbody>';

  sorted.forEach(function(h){
    var sig = SIG[h.signal] || SIG.hold;
    var wchg = h.weight_chg != null ? (h.weight_chg > 0 ? "+" : "") + h.weight_chg.toFixed(2) : "-";
    var wchgColor = (h.weight_chg||0) > 0 ? "var(--up)" : (h.weight_chg||0) < 0 ? "var(--down)" : "var(--muted)";
    var rowCls = h.signal === "new" ? "row-new" : h.signal === "buy" ? "row-buy" : h.signal === "sell" || h.signal === "removed" ? "row-sell" : "";
    var shares = h.shares ? h.shares.toLocaleString() : "-";
    html += '<tr class="' + rowCls + '">'
      + '<td style="width:54px">' + (sig.emoji ? '<span class="sig ' + sig.cls + '">' + sig.emoji + ' ' + sig.label + '</span>' : '') + '</td>'
      + '<td class="ticker" style="width:62px">' + (h.ticker||"<span style='color:var(--muted);font-size:11px'>"+h.name.slice(0,8)+"</span>") + '</td>'
      + '<td class="name-cell" title="' + h.name + '">' + h.name + '</td>'
      + '<td class="sector-cell" title="' + (h.sector||"") + '">' + (h.sector||"") + '</td>'
      + '<td class="r" style="font-weight:700;width:54px">' + h.weight.toFixed(2) + '</td>'
      + '<td class="r" style="color:' + wchgColor + ';width:66px">' + wchg + '</td>'
      + '<td class="r" style="width:80px;font-size:11px">' + shares + '</td>'
      + '</tr>';
  });
  html += '</tbody></table></div>';

  // 분기 히스토리 요약
  if (inv.quarters.length > 1){
    html += '<div style="font-size:12px;color:var(--muted);margin-top:20px;margin-bottom:8px;font-weight:600">📅 분기 히스토리</div>';
    html += '<div style="display:flex;flex-wrap:wrap;gap:8px">';
    inv.quarters.slice().reverse().forEach(function(q2){
      var active2 = q2.filing_date === q.filing_date;
      html += '<div style="font-size:11px;padding:4px 8px;border-radius:4px;background:' + (active2?"rgba(99,102,241,0.15)":"var(--surface)") + ';color:' + (active2?"var(--accent2)":"var(--muted)") + ';border:1px solid var(--border)">'
        + q2.filing_date + ' (' + q2.holdings.filter(function(h){return h.signal!=="removed";}).length + '종목)'
        + '</div>';
    });
    html += '</div>';
  }

  el.innerHTML = html;
}

/* ── History Tab ── */
function renderHistory(el){
  var tickerInfo = {};
  var etfGroups = {
    nasdaq: ["time","koact"],
    ark:    ["arkk","arkq","arkw","arkg"],
    kosdaq: ["kosdaq","time_kosdaq"]
  };

  ["time","koact","kosdaq","time_kosdaq","arkk","arkq","arkw","arkg"].forEach(function(key){
    if (!DATA[key]) return;
    var hist = DATA[key].history || {};
    Object.keys(hist).forEach(function(t){
      if (!tickerInfo[t]) tickerInfo[t] = {etfs:[], maxWeight:0, name:t};
      if (tickerInfo[t].etfs.indexOf(key) === -1) tickerInfo[t].etfs.push(key);
      var arr = hist[t];
      if (arr && arr.length){
        var w = arr[arr.length-1].weight || 0;
        if (w > tickerInfo[t].maxWeight) tickerInfo[t].maxWeight = w;
      }
    });
    var weeks = DATA[key].weeks;
    if (weeks && weeks.length){
      weeks[weeks.length-1].holdings.forEach(function(h){
        if (tickerInfo[h.ticker]) tickerInfo[h.ticker].name = h.name || h.ticker;
      });
    }
  });

  function groupTickers(groupKeys, excludeGroups){
    var excludeKeys = [];
    (excludeGroups||[]).forEach(function(g){ excludeKeys = excludeKeys.concat(etfGroups[g]||[]); });
    return Object.keys(tickerInfo).filter(function(t){
      var inGroup   = tickerInfo[t].etfs.some(function(k){ return groupKeys.indexOf(k) !== -1; });
      var inExclude = excludeKeys.length && tickerInfo[t].etfs.some(function(k){ return excludeKeys.indexOf(k) !== -1; });
      return inGroup && !inExclude;
    }).sort(function(a,b){ return tickerInfo[b].maxWeight - tickerInfo[a].maxWeight; });
  }

  var nasdaqTickers = groupTickers(etfGroups.nasdaq);
  var arkTickers    = groupTickers(etfGroups.ark, ["nasdaq"]);
  var kosdaqTickers = groupTickers(etfGroups.kosdaq, ["nasdaq","ark"]);

  function buildSelect(id, label, color, tickers){
    if (!tickers.length) return "";
    var s = '<div style="display:flex;align-items:center;gap:8px">'
      + '<label style="font-size:11px;color:' + color + ';font-weight:700;white-space:nowrap">' + label + '</label>'
      + '<select class="history-select" id="' + id + '">';
    tickers.forEach(function(t){
      var info = tickerInfo[t];
      s += '<option value="' + t + '">' + t + '  ' + info.name + '  (' + info.maxWeight.toFixed(1) + '%)</option>';
    });
    return s + '</select></div>';
  }

  // ── 한국 ETF 섹션 ──
  var html = '<div style="font-size:12px;font-weight:700;color:var(--muted);letter-spacing:.05em;margin-bottom:10px">🇰🇷 한국 ETF</div>';
  html += '<div style="display:flex;flex-wrap:wrap;gap:16px;margin-bottom:16px;align-items:center">';
  html += buildSelect("history-nasdaq","나스닥","var(--accent2)",nasdaqTickers);
  html += buildSelect("history-kosdaq","코스닥","#14b8a6",kosdaqTickers);
  html += '</div>';
  html += '<div class="chart-card" style="margin-bottom:12px"><h3>비중 (%)</h3><canvas id="history-chart" height="200"></canvas></div>';
  html += '<div class="chart-card" style="margin-bottom:32px"><h3>수량</h3><canvas id="history-shares-chart" height="200"></canvas></div>';

  // ── ARK ETF 섹션 (구분) ──
  html += '<div style="border-top:1px solid var(--border);padding-top:24px;margin-bottom:10px">';
  html += '<div style="font-size:12px;font-weight:700;color:var(--muted);letter-spacing:.05em;margin-bottom:10px">🇺🇸 ARK ETF</div>';
  html += '<div style="display:flex;flex-wrap:wrap;gap:16px;margin-bottom:16px;align-items:center">';
  html += buildSelect("history-ark","ARK","#ef4444",arkTickers);
  html += '</div>';
  html += '<div class="chart-card" style="margin-bottom:12px"><h3>비중 (%)</h3><canvas id="ark-history-chart" height="200"></canvas></div>';
  html += '<div class="chart-card"><h3>수량 (주)</h3><canvas id="ark-history-shares-chart" height="200"></canvas></div>';
  html += '</div>';

  el.innerHTML = html;

  // 한국 ETF 이벤트
  ["history-nasdaq","history-kosdaq"].forEach(function(id){
    var sel = document.getElementById(id);
    if (!sel) return;
    sel.addEventListener("change", function(){ drawHistoryChart(this.value); });
  });
  var firstKor = document.getElementById("history-nasdaq") || document.getElementById("history-kosdaq");
  if (firstKor) drawHistoryChart(firstKor.value);

  // ARK ETF 이벤트
  var arkSel = document.getElementById("history-ark");
  if (arkSel){
    arkSel.addEventListener("change", function(){ drawArkHistoryChart(this.value); });
    drawArkHistoryChart(arkSel.value);
  }
}

var historyChartInstance = null;
var historySharesChartInstance = null;
var arkHistoryChartInstance = null;
var arkHistorySharesChartInstance = null;

var HISTORY_META = {
  time:        {label:"TIME 나스닥",   border:"#6366f1", bg:"rgba(99,102,241,0.1)"},
  koact:       {label:"KoAct 나스닥",  border:"#a78bfa", bg:"rgba(167,139,250,0.1)"},
  kosdaq:      {label:"KoAct 코스닥",  border:"#14b8a6", bg:"rgba(20,184,166,0.1)"},
  time_kosdaq: {label:"TIME 코스닥",   border:"#f59e0b", bg:"rgba(245,158,11,0.1)"},
  arkk:        {label:"ARKK 혁신",     border:"#ef4444", bg:"rgba(239,68,68,0.1)"},
  arkq:        {label:"ARKQ 로봇/자율",border:"#f97316", bg:"rgba(249,115,22,0.1)"},
  arkw:        {label:"ARKW 인터넷/AI",border:"#8b5cf6", bg:"rgba(139,92,246,0.1)"},
  arkg:        {label:"ARKG 바이오",   border:"#10b981", bg:"rgba(16,185,129,0.1)"},
};

var CHART_COMMON_OPTS = {
  responsive: true,
  scales: {
    x: {grid:{color:"#2e3341"}, ticks:{color:"#8b8fa3", font:{size:10}}},
    y: {grid:{color:"#2e3341"}, ticks:{color:"#8b8fa3"}}
  },
  plugins: {
    legend:{labels:{color:"#8b8fa3", font:{size:11}}},
    tooltip:{mode:"index", intersect:false}
  }
};

function _buildHistoryDatasets(ticker, keys){
  var allDates = new Set();
  keys.forEach(function(key){
    if (!DATA[key]) return;
    var hist = (DATA[key].history || {})[ticker];
    if (hist) hist.forEach(function(p){ allDates.add(p.date); });
  });
  var dates = Array.from(allDates).sort();
  var weightDs = [], sharesDs = [];
  keys.forEach(function(key){
    if (!DATA[key]) return;
    var hist = (DATA[key].history || {})[ticker];
    if (!hist) return;
    var m = HISTORY_META[key];
    var wMap = {}, sMap = {};
    hist.forEach(function(p){ wMap[p.date] = p.weight; sMap[p.date] = p.shares; });
    var base = {label:m.label, borderColor:m.border, backgroundColor:m.bg, fill:true, tension:0.3, pointRadius:3, pointHoverRadius:5, spanGaps:true};
    weightDs.push(Object.assign({}, base, {data: dates.map(function(d){ return wMap[d] != null ? wMap[d] : null; })}));
    var hasShares = hist.some(function(p){ return p.shares != null; });
    if (hasShares){
      sharesDs.push(Object.assign({}, base, {fill:false, data: dates.map(function(d){ return sMap[d] != null ? sMap[d] : null; })}));
    }
  });
  return {dates:dates, weightDs:weightDs, sharesDs:sharesDs};
}

// 한국 ETF 히스토리 차트
function drawHistoryChart(ticker){
  var r = _buildHistoryDatasets(ticker, ["time","koact","kosdaq","time_kosdaq"]);
  var ctx1 = document.getElementById("history-chart");
  if (ctx1){
    if (historyChartInstance) historyChartInstance.destroy();
    historyChartInstance = new Chart(ctx1, {type:"line", data:{labels:r.dates, datasets:r.weightDs},
      options:Object.assign({},CHART_COMMON_OPTS,{scales:Object.assign({},CHART_COMMON_OPTS.scales,{
        y:{grid:{color:"#2e3341"},ticks:{color:"#8b8fa3"},title:{display:true,text:"비중(%)",color:"#8b8fa3"}}})})});
  }
  var ctx2 = document.getElementById("history-shares-chart");
  if (ctx2){
    if (historySharesChartInstance) historySharesChartInstance.destroy();
    if (r.sharesDs.length){
      historySharesChartInstance = new Chart(ctx2, {type:"line", data:{labels:r.dates, datasets:r.sharesDs},
        options:Object.assign({},CHART_COMMON_OPTS,{scales:Object.assign({},CHART_COMMON_OPTS.scales,{
          y:{grid:{color:"#2e3341"},ticks:{color:"#8b8fa3",callback:function(v){return v>=10000?(v/10000).toFixed(0)+'만':v.toLocaleString();}},title:{display:true,text:"수량",color:"#8b8fa3"}}})})});
      ctx2.parentElement.style.display = "";
    } else { ctx2.parentElement.style.display = "none"; }
  }
}

// ARK ETF 히스토리 차트
function drawArkHistoryChart(ticker){
  var r = _buildHistoryDatasets(ticker, ["arkk","arkq","arkw","arkg"]);
  var ctx1 = document.getElementById("ark-history-chart");
  if (ctx1){
    if (arkHistoryChartInstance) arkHistoryChartInstance.destroy();
    arkHistoryChartInstance = new Chart(ctx1, {type:"line", data:{labels:r.dates, datasets:r.weightDs},
      options:Object.assign({},CHART_COMMON_OPTS,{scales:Object.assign({},CHART_COMMON_OPTS.scales,{
        y:{grid:{color:"#2e3341"},ticks:{color:"#8b8fa3"},title:{display:true,text:"비중(%)",color:"#8b8fa3"}}})})});
  }
  var ctx2 = document.getElementById("ark-history-shares-chart");
  if (ctx2){
    if (arkHistorySharesChartInstance) arkHistorySharesChartInstance.destroy();
    if (r.sharesDs.length){
      arkHistorySharesChartInstance = new Chart(ctx2, {type:"line", data:{labels:r.dates, datasets:r.sharesDs},
        options:Object.assign({},CHART_COMMON_OPTS,{scales:Object.assign({},CHART_COMMON_OPTS.scales,{
          y:{grid:{color:"#2e3341"},ticks:{color:"#8b8fa3",callback:function(v){return v.toLocaleString();}},title:{display:true,text:"수량(주)",color:"#8b8fa3"}}})})});
      ctx2.parentElement.style.display = "";
    } else { ctx2.parentElement.style.display = "none"; }
  }
}

updateUIVisibility();
